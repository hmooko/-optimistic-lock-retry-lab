global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: spring-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:18080

  - job_name: node
    static_configs:
      - targets:
          - host.docker.internal:19100
        labels:
          role: app
      - targets:
          - host.docker.internal:19101
        labels:
          role: db
      - targets:
          - host.docker.internal:19102
        labels:
          role: load
