name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Java unit and MySQL integration tests
        run: mvn -B test

      - name: Result aggregator tests
        run: python -m unittest scripts/test_aggregate_results.py

      - name: Validate shell scripts
        run: |
          bash -n scripts/calibrate.sh
          bash -n scripts/run-matrix.sh
          bash -n scripts/run-k6-docker.sh
          bash -n scripts/aggregate-results-docker.sh
          bash -n scripts/smoke-test.sh
          bash -n scripts/record-docker-environment.sh

      - name: Validate experiment Compose files
        run: |
          docker compose -f deploy/app/compose.yml config >/dev/null
          docker compose -f deploy/db/compose.yml config >/dev/null
          HOST_UID="$(id -u)" HOST_GID="$(id -g)" docker compose -f deploy/load/compose.yml config >/dev/null

      - name: Build experiment application image
        run: docker build -f deploy/app/Dockerfile -t optimistic-lock-retry-lab-app:ci .
