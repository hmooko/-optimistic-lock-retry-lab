services:
  mysql:
    image: mysql:8.4.11
    container_name: retry-lab-mysql
    restart: unless-stopped
    network_mode: host
    cpus: "3.0"
    mem_limit: 8g
    environment:
      MYSQL_DATABASE: retry_lab
      MYSQL_USER: retry_lab
      MYSQL_PASSWORD: retry-lab-2026
      MYSQL_ROOT_PASSWORD: root-retry-lab-2026
    command:
      - --transaction-isolation=READ-COMMITTED
      - --innodb-buffer-pool-size=4G
      - --innodb-flush-log-at-trx-commit=1
      - --skip-log-bin
      - --skip-name-resolve
    volumes:
      - ${MYSQL_DATA_DIR:-/data/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-retry-lab-2026"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
