spring:
  application:
    name: optimistic-lock-retry-lab
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/retry_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:retry_lab}
    password: ${DB_PASSWORD:retry_lab}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:32}
      minimum-idle: ${DB_POOL_MIN_IDLE:8}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
benchmark:
  retry:
    max-retries: ${MAX_RETRIES:5}
    fixed-delay-ms: ${FIXED_DELAY_MS:20}
    exponential-base-ms: ${EXP_BASE_MS:5}
    exponential-cap-ms: ${EXP_CAP_MS:80}
    jitter-ratio: ${JITTER_RATIO:0.5}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
